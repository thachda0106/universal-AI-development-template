adapter: opencode
version: "1.0.0"
target_dirs:
  - ".opencode/"
  - ".opencode/agents/"
  - ".opencode/commands/"
  - ".opencode/skills/"
  - ".opencode/context/"

mappings:
  context:
    ".ai/context/PROJECT.md":
      target: "AGENTS.md"
      transform: "merge_context_files"
      note: "OpenCode primary instruction file"
    ".ai/context/CONVENTIONS.md":
      target: "AGENTS.md"
      transform: "append"
    ".ai/context/BOUNDARIES.md":
      target: "AGENTS.md"
      transform: "append"
    ".ai/context/ARCHITECTURE_REVIEW.md":
      target: ".opencode/context/ARCHITECTURE_REVIEW.md"
      transform: "copy"
    ".ai/context/RECOMMENDED_STRUCTURE.md":
      target: ".opencode/context/RECOMMENDED_STRUCTURE.md"
      transform: "copy"
    ".ai/context/ADR_CANDIDATES.md":
      target: ".opencode/context/ADR_CANDIDATES.md"
      transform: "copy"

  agents:
    ".ai/agents/*.agent.md":
      target: ".opencode/agents/{stem}.md"
      transform: "copy"
      note: "Agent markdown files with YAML frontmatter — body is the agent prompt"

  workflows:
    ".ai/workflows/*.md":
      target: ".opencode/commands/{filename}"
      transform: "copy"
      note: "Workflow files become custom command prompt templates"

  skills:
    ".ai/skills/*/SKILL.md":
      target: ".opencode/skills/{dirname}/SKILL.md"
      transform: "copy"
      note: "Skill modules with SKILL.md in named subdirectories"

  prompts:
    ".ai/prompts/system.md":
      target: "AGENTS.md"
      transform: "append"

  scripts:
    ".ai/scripts/*.sh":
      target: null
      transform: "skip"
      note: "OpenCode scripts are referenced in AGENTS.md but not copied"

  docs:
    ".ai/docs/*":
      target: null
      transform: "skip"
      note: "OpenCode documentation referenced in AGENTS.md"