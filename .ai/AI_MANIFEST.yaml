    - apply-targeted-fix
    - diagnose-bug-root-cause
    - life-engineering-daily-practices
    - locate-code-patterns
    - trace-execution-flow
    - validate-architecture
    - verify-bug-regression

# Operating model — 5 phases
operating_model: "plan-review-execute-verify-reflect"
