    - bug-hunter
    - business-panel-experts
    - code-reviewer
    - deep-research
    - deep-research-agent
    - devops-architect
    - doc-keeper
    - feature-builder
    - frontend-architect
    - learning-guide
    - life-engineer
    - performance-optimizer
    - platform-architect
    - pm-agent
    - python-expert
    - quality-engineer
    - refactoring-expert
    - repo-index
    - requirements-analyst
    - review-agent
    - root-cause-analyst
    - security-engineer
    - socratic-mentor
    - test-engineer
  docs:
    - life-engineering
  workflows:
    - ai-workflow
    - create-feature
    - design-platform-core
    - design-to-code-pipeline
    - fix-bug
    - review-pr
    - review-plan
    - review-implemented-files
    - add-tests
    - get-docs
